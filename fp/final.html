<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Volume Game</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>
    <!-- change timer to volume  -->
    <!-- remove arrow thingies at bottom -->
    <!-- consider punishment for user when ball hits wall -->
    <h1> DRAG VOLUME HERE</h1>
    <h2> Complete maze to Submit</h2>
    <div id="timer">Timer: 30</div> 
    <div id="maze-container">
        <div id="maze"></div>
        <div id="player"></div>
    </div>
    <div id="controls">
        <button class="control-btn" id="up" onclick="movePlayer('up')">up</button>
        <button class="control-btn" id="down" onclick="movePlayer('down')">down</button>
        <button class="control-btn" id="left" onclick="movePlayer('left')">left</button>
        <button class="control-btn" id="right" onclick="movePlayer('right')">right</button>
    </div>

    <div id="message">
        <h2 id="message-text"></h2>
        <button id="try-again" onclick="initGame()">Try Again</button>
    </div>
    <div id="volume-control">
        <label for="volume">Volume: <span id="volume-value">50</span></label>
        <input type="range" id="volume" min="0" max="100" value="50">
    </div>

    <script src="final.js"></script>
</body>
</html>
